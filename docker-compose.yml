services:
  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Hot reload: local edits under backend/app/ restart uvicorn --reload
      - ./backend/app:/app/app
      # Persist SQLite runs outside the container.
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      # Hot reload: local edits under frontend/ refresh next dev.
      # Anonymous volumes keep container-owned node_modules/.next intact.
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
