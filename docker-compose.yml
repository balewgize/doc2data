services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_CHARS_PER_CHUNK: ${MAX_CHARS_PER_CHUNK:-12000}
      MAX_CHUNK_WORKERS: ${MAX_CHUNK_WORKERS:-4}
      DATABASE_PATH: /app/data/doc2data.db
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Hot reload: local edits under backend/app/ restart uvicorn --reload
      - ./backend/app:/app/app
      # Persist SQLite runs outside the container.
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      # Hot reload: local edits under frontend/ refresh next dev.
      # Anonymous volumes keep container-owned node_modules/.next intact.
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
