services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_CHARS_PER_CHUNK: ${MAX_CHARS_PER_CHUNK:-12000}
      DATABASE_PATH: /app/data/doc2data.db
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: local edits under backend/app/ restart uvicorn --reload
      - ./backend/app:/app/app
      # Persist SQLite runs outside the container.
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      # Hot reload: local edits under frontend/ refresh next dev.
      # Anonymous volumes keep container-owned node_modules/.next intact.
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
